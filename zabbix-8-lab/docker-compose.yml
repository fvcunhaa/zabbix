services:
  postgres:
    image: postgres:18
    container_name: zabbix80-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [zabbix80]

  clickhouse:
    image: clickhouse/clickhouse-server:26.4
    container_name: zabbix80-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "8123:8123"
      - "9000:9000"
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user ${CLICKHOUSE_USER} --password ${CLICKHOUSE_PASSWORD} --query 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [zabbix80]

  selenium:
    image: selenium/standalone-chromium:latest
    container_name: zabbix80-selenium
    restart: unless-stopped
    shm_size: 2gb
    environment:
      SE_NODE_MAX_SESSIONS: 5
      SE_NODE_OVERRIDE_MAX_SESSIONS: "true"
    ports:
      - "${SELENIUM_PORT}:4444"
    networks: [zabbix80]

  zabbix-server:
    build:
      context: .
      dockerfile: zabbix/Dockerfile.core
      args:
        ZABBIX_SOURCE_URL: ${ZABBIX_SOURCE_URL}
    image: local/zabbix-core:${ZABBIX_VERSION}
    container_name: zabbix80-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      selenium:
        condition: service_started
    environment:
      DB_SERVER_HOST: postgres
      DB_SERVER_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_HISTORY_TTL: ${CLICKHOUSE_HISTORY_TTL}
      ZBX_WEBDRIVERURL: http://selenium:4444
      ZBX_STARTBROWSERPOLLERS: ${ZBX_STARTBROWSERPOLLERS}
      ZBX_WEBSERVICEURL: http://zabbix-web-service:10053/report
      ZBX_STARTREPORTWRITERS: ${ZBX_STARTREPORTWRITERS}
      ZBX_LOGLEVEL: ${ZBX_LOGLEVEL}
    entrypoint: ["/usr/local/bin/zabbix-server-entrypoint"]
    ports:
      - "10051:10051"
    networks: [zabbix80]

  zabbix-web:
    build:
      context: .
      dockerfile: zabbix/Dockerfile.web
      args:
        ZABBIX_SOURCE_URL: ${ZABBIX_SOURCE_URL}
    image: local/zabbix-web:${ZABBIX_VERSION}
    container_name: zabbix80-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      zabbix-server:
        condition: service_started
    environment:
      DB_SERVER_HOST: postgres
      DB_SERVER_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ZBX_SERVER_HOST: zabbix-server
      ZBX_SERVER_PORT: 10051
      ZBX_SERVER_NAME: ${ZBX_SERVER_NAME}
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    ports:
      - "${ZABBIX_WEB_PORT}:8080"
    networks: [zabbix80]

  zabbix-agent2:
    image: local/zabbix-core:${ZABBIX_VERSION}
    container_name: zabbix80-agent2
    restart: unless-stopped
    depends_on:
      zabbix-server:
        condition: service_started
    environment:
      ZBX_SERVER_HOST: zabbix-server
      ZBX_HOSTNAME: zabbix-agent2-lab
    entrypoint: ["/usr/local/bin/zabbix-agent2-entrypoint"]
    networks: [zabbix80]

  zabbix-web-service:
    image: local/zabbix-core:${ZABBIX_VERSION}
    container_name: zabbix80-web-service
    restart: unless-stopped
    depends_on:
      zabbix-web:
        condition: service_started
    entrypoint: ["/usr/local/bin/zabbix-web-service-entrypoint"]
    networks: [zabbix80]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: zabbix80-otel-collector
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - ./otel/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "${OTEL_GRPC_PORT}:4317"
      - "${OTEL_HTTP_PORT}:4318"
      - "${OTEL_HEALTH_PORT}:13133"
    networks: [zabbix80]

networks:
  zabbix80:
    name: zabbix80-lab

volumes:
  postgres_data:
  clickhouse_data:
